<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IN · ON · AT — тренажер</title>
  <meta name="description" content="Наочні правила вживання прийменників in, on, at з прикладами.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top glass">
    <a class="brand" href="#hero">in<span>·</span>on<span>·</span>at</a>
    <nav>
      <a href="#in" class="pill pill-in">IN</a>
      <a href="#on" class="pill pill-on">ON</a>
      <a href="#at" class="pill pill-at">AT</a>
      <a href="#vs" class="pill pill-vs">AT vs IN</a>
    </nav>
    <label class="toggle" title="Сховати прийменники і перевірити себе">
      <input type="checkbox" id="quizMode">
      <span class="track"><span class="thumb"></span></span>
      <span class="toggle-label">Перевір себе</span>
    </label>
  </header>

  <main>
    <section id="hero" class="hero">
      <h1>Де саме? <em>IN</em>, <em>ON</em> чи <em>AT</em></h1>
      <p class="lead">Одна картинка, щоб запам'ятати різницю:</p>
      <div class="big3">
        <figure class="glass big in">
          <div class="cube"><i class="dot"></i></div>
          <figcaption><b>IN</b> — всередині</figcaption>
        </figure>
        <figure class="glass big on">
          <div class="cube"><i class="dot"></i></div>
          <figcaption><b>ON</b> — на поверхні</figcaption>
        </figure>
        <figure class="glass big at">
          <div class="cube"><i class="dot"></i></div>
          <figcaption><b>AT</b> — у точці, поруч</figcaption>
        </figure>
      </div>
    </section>

    <div id="rules"></div>

    <section id="vs" class="block">
      <div class="block-head">
        <span class="badge badge-vs">AT vs IN</span>
        <p>Одне й те саме місце, але різний сенс</p>
      </div>
      <div id="vsGrid" class="vs-grid"></div>
    </section>
  </main>

  <footer>Натисни <b>«Перевір себе»</b> вгорі — прийменники сховаються. Торкнись пропуску, щоб побачити відповідь.</footer>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
