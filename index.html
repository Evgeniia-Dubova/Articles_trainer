<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Тренажер артиклів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap">
</head><body>
<style>
/* Layout: sticker-style cards on a dotted notebook ground; one colour per article (a/an coral, the teal, Ø mustard) */
:root{
  --bg:#eef5f2; --dot:rgba(27,34,48,.10); --card:#ffffff; --ink:#1b2230; --muted:#5a6575;
  --stroke:#1b2230; --shadow:#1b2230; --on:#1b2230;
  --a:#ff6a4d; --a-soft:#ffe2da; --the:#12a397; --the-soft:#d3f2ee; --z:#f2b200; --z-soft:#fff0c0;
  --ok:#1d9a52; --ok-soft:#d9f5e4; --bad:#dc4136; --bad-soft:#fde0dd;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121820; --dot:rgba(238,242,247,.07); --card:#1b232e; --ink:#eef2f7; --muted:#9ba7b7;
  --stroke:#3c4859; --shadow:#05080b; --on:#141a22;
  --a:#ff8068; --a-soft:#3b2420; --the:#2fc3b6; --the-soft:#12332f; --z:#ffc93d; --z-soft:#382e14;
  --ok:#3fcf7d; --ok-soft:#16301f; --bad:#ff6b60; --bad-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121820; --dot:rgba(238,242,247,.07); --card:#1b232e; --ink:#eef2f7; --muted:#9ba7b7;
  --stroke:#3c4859; --shadow:#05080b; --on:#141a22;
  --a:#ff8068; --a-soft:#3b2420; --the:#2fc3b6; --the-soft:#12332f; --z:#ffc93d; --z-soft:#382e14;
  --ok:#3fcf7d; --ok-soft:#16301f; --bad:#ff6b60; --bad-soft:#3a1d1b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--the);outline-offset:3px}

.sticker{background:var(--card);border:2.5px solid var(--stroke);border-radius:18px;box-shadow:4px 4px 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--stroke);border-radius:14px;
  padding:11px 18px;font-weight:900;background:var(--card);box-shadow:3px 3px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--a);color:var(--on)}
.btn.teal{background:var(--the);color:var(--on)}
.btn.sun{background:var(--z);color:var(--on)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;padding:8px 10px}
.btn:disabled{opacity:.45;pointer-events:none}

/* hero */
.hero{display:grid;gap:18px}
.tokens{display:flex;gap:10px;flex-wrap:wrap}
.tok{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,46px);padding:4px 18px;border:2.5px solid var(--stroke);
  border-radius:16px;box-shadow:4px 4px 0 var(--shadow);color:var(--on);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.tok:nth-child(1){background:var(--a);transform:rotate(-4deg)}
.tok:nth-child(2){background:var(--a);transform:rotate(3deg);animation-delay:.06s}
.tok:nth-child(3){background:var(--the);transform:rotate(-2deg);animation-delay:.12s}
.tok:nth-child(4){background:var(--z);transform:rotate(5deg);animation-delay:.18s}
@keyframes pop{from{scale:.6}to{scale:1}}
.hero h1{font-size:clamp(26px,5.4vw,40px);font-weight:800}
.hero .lead{color:var(--muted);font-size:17px;max-width:56ch}
.statrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--bg);border:2px solid var(--stroke);overflow:hidden;flex:1;min-width:140px}
.bar i{display:block;height:100%;background:var(--the);border-radius:99px;transition:width .4s}
.meta{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:12px}

.tip{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;background:var(--z-soft)}
.tip b.k{font-family:var(--display);font-size:13px;background:var(--z);color:var(--on);padding:4px 9px;border-radius:9px;border:2px solid var(--stroke);white-space:nowrap}

/* topic */
.topic{display:grid;gap:16px}
.topic-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.badge{font-family:var(--display);font-weight:800;font-size:22px;min-width:64px;text-align:center;padding:6px 14px;border-radius:14px;
  border:2.5px solid var(--stroke);box-shadow:3px 3px 0 var(--shadow);color:var(--on)}
.g-a .badge,.g-a.badge{background:var(--a)} .g-the .badge,.g-the.badge{background:var(--the)} .g-zero .badge,.g-zero.badge{background:var(--z)}
.topic-head h2{font-size:20px}
.topic-head .sub{color:var(--muted);font-weight:700;font-size:14px}
.topic-head .spacer{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rcard{text-align:left;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .12s,box-shadow .12s}
.rcard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.rcard h3{font-family:var(--body);font-weight:900;font-size:17px}
.rcard p{color:var(--muted);font-size:14.5px;flex:1}
.rcard .foot{display:flex;align-items:center;gap:10px}
.rcard .bar{height:8px;border-width:1.5px}
.g-a .rcard .bar i{background:var(--a)} .g-the .rcard .bar i{background:var(--the)} .g-zero .rcard .bar i{background:var(--z)}
.num{font-family:var(--display);font-size:12px;opacity:.6}

/* rule view */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rule{padding:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.rule>*,.q>*{min-width:0}
@media (max-width:480px){.rule{padding:18px 14px}}
.rule h1{font-size:clamp(22px,4.6vw,32px)}
.rule .explain{font-size:17px;max-width:62ch}
.exlist{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.exlist li{padding:12px 16px;border-radius:14px;border:2px dashed var(--stroke);font-size:18px;font-weight:700}
.exlist li span.ua{display:block;font-weight:600;font-size:14px;color:var(--muted)}
.art{display:inline-block;padding:0 7px;margin:0 1px;border-radius:8px;font-weight:900;color:var(--on)}
.art.k-a{background:var(--a)} .art.k-the{background:var(--the)} .art.k-z{background:var(--z);font-family:var(--display);font-size:.8em;padding:1px 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:99px;border:2px solid var(--stroke);font-weight:800;font-size:14px;background:var(--card)}
.tablewrap{overflow-x:auto;border:2px solid var(--stroke);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
th,td{text-align:left;padding:9px 14px;border-bottom:1.5px solid var(--stroke);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--display);font-size:12px;letter-spacing:.04em;background:var(--z-soft)}
td:first-child{font-weight:800;white-space:nowrap}
.label{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* practice */
.pbar{display:flex;align-items:center;gap:12px}
.streak{font-weight:900;font-size:14px;padding:5px 12px;border-radius:99px;border:2px solid var(--stroke);background:var(--z);color:var(--on);font-variant-numeric:tabular-nums;white-space:nowrap}
.q{padding:24px 20px;display:grid;gap:22px}
.q .ask{font-family:var(--display);font-size:13px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.sent{font-size:clamp(21px,4.6vw,28px);font-weight:800;line-height:1.5}
.slot{display:inline-block;min-width:2.8em;text-align:center;border-bottom:4px dashed var(--muted);margin:0 3px;padding:0 6px;line-height:1.25}
.slot.ok{background:var(--ok-soft);border-bottom:4px solid var(--ok);border-radius:8px 8px 0 0}
.slot.bad{background:var(--bad-soft);border-bottom:4px solid var(--bad);border-radius:8px 8px 0 0;text-decoration:line-through}
.slot.hl{border-bottom:0;background:var(--the);color:var(--on);border-radius:9px}
.slot.z{font-family:var(--display);font-size:.75em}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opts.why{grid-template-columns:1fr}
@media (max-width:480px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{padding:14px 10px;font-size:20px;font-family:var(--display);font-weight:700;text-align:center}
.opts.why .opt{font-family:var(--body);font-size:16px;font-weight:800;text-align:left;justify-content:flex-start;padding:13px 16px}
.opt small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);display:block}
.opt.right{background:var(--ok);color:var(--on)} .opt.right small{color:var(--on)}
.opt.wrong{background:var(--bad);color:var(--on);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:16px;border:2.5px solid var(--stroke);padding:16px 18px;display:grid;gap:10px}
.fb.good{background:var(--ok-soft)} .fb.miss{background:var(--bad-soft)}
.fb h3{font-family:var(--body);font-weight:900;font-size:18px}
.fb .rl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.minichip{font-weight:900;font-size:13px;padding:3px 10px;border-radius:99px;border:2px solid var(--stroke);color:var(--on)}
.minichip.g-a{background:var(--a)} .minichip.g-the{background:var(--the)} .minichip.g-zero{background:var(--z)}
.link{background:none;border:0;padding:0;font-weight:900;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.hint{font-size:13px;color:var(--muted);font-weight:700;text-align:center}

/* end */
.end{padding:30px 22px;text-align:center;display:grid;gap:16px;justify-items:center}
.score{font-family:var(--display);font-weight:800;font-size:clamp(56px,14vw,88px);line-height:1;font-variant-numeric:tabular-nums}
.end .actions{justify-content:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.unc{padding:18px;display:grid;gap:14px;background:var(--a-soft)}
.unc-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.unc-head .badge{background:var(--card);color:var(--ink)}
.unc-head h3{font-family:var(--body);font-weight:900;font-size:17px}
.unc-head p{color:var(--muted);font-size:14.5px;max-width:56ch}
.unc .tablewrap{background:var(--card)}
.exlist li .en{font-size:18px;font-weight:700}
.trbtn{margin-top:6px;background:none;border:0;padding:2px 0;font-weight:800;font-size:13.5px;color:var(--the);text-decoration:underline;text-underline-offset:3px}
.tr{display:block;font-weight:700;font-size:15px;margin-top:4px;padding:6px 10px;border-radius:10px;background:var(--the-soft)}
.q .tr{font-size:16px}
.w{border-radius:5px;transition:background .15s}
.w.marked{background:var(--z-soft);box-shadow:inset 0 -3px 0 var(--z)}
body.wm .w{cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:4px}
body.wm .w:hover{background:var(--z-soft)}
.wmode{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;
  padding:10px 16px 10px 10px;border-radius:99px;border:2.5px solid var(--stroke);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-weight:900;font-size:14px}
.wmode b{font-family:var(--display);font-size:12px;width:30px;height:30px;display:grid;place-items:center;border-radius:99px;background:var(--z-soft);border:2px solid var(--stroke)}
.wmode.on{background:var(--z);color:var(--on)} .wmode.on b{background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:16;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.wrap{padding-bottom:60px}
.addform{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:16px;border-radius:14px;border:2px dashed var(--stroke);background:var(--z-soft)}
.addform label,.flabel{font-weight:800;font-size:14px}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1;min-width:0}
input[type=text]{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--stroke);border-radius:12px;padding:10px 12px}
input[type=text]:focus{outline:3px solid var(--the);outline-offset:1px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;min-width:52px;text-align:center;padding:8px 12px;border:2px solid var(--stroke);border-radius:12px;font-family:var(--display);font-size:15px;background:var(--card);cursor:pointer}
.seg input:checked+span{background:var(--z);color:var(--on)}
.seg input:focus-visible+span{outline:3px solid var(--the);outline-offset:2px}
.ferr{color:var(--bad);font-weight:800;font-size:14px}
.addform .btn{justify-self:start}
.mineli{position:relative}
.del{display:block;margin-top:6px;background:none;border:0;padding:0;font-weight:800;font-size:13px;color:var(--bad);text-decoration:underline;text-underline-offset:3px}
.wlist{display:grid;gap:12px}
.witem{padding:14px;border:2px solid var(--stroke);border-radius:14px;display:grid;gap:8px;background:var(--bg)}
.whead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ww{font-family:var(--display);font-size:20px}
.glink{font-weight:800;font-size:13.5px;color:var(--the)}
.wctx{color:var(--muted);font-weight:700;font-style:italic}
.panel{padding:20px;display:grid;gap:16px}
.phead{display:grid;gap:4px}
.phead h2{font-size:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;padding:14px 16px;border:2.5px solid var(--stroke);border-radius:16px;background:var(--card);display:grid;gap:4px;transition:transform .12s,box-shadow .12s}
.mode b{font-family:var(--display);font-size:15px}
.mode span{font-size:14px;color:var(--muted);font-weight:700}
.mode.sel{box-shadow:4px 4px 0 var(--shadow);transform:translate(-2px,-2px)}
.mode.sel.m-a{background:var(--a-soft)} .mode.sel.m-the{background:var(--the-soft)} .mode.sel.m-zero{background:var(--z-soft)}
.mode.sel b::before{content:"✓ ";}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sline{display:flex;gap:10px;align-items:center;margin-top:6px}
.sbar{flex:1;height:12px;border-radius:99px;border:2px solid var(--stroke);overflow:hidden;background:var(--bg);min-width:60px}
.sbar i{display:block;height:100%}
.sbar i.g-a{background:var(--a)} .sbar i.g-the{background:var(--the)} .sbar i.g-zero{background:var(--z)}
.btn.small{padding:6px 12px;font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.sent.spot .tk{cursor:pointer;border-radius:8px;padding:0 3px;transition:background .12s}
.sent.spot:not(.done) .tk:hover{background:var(--the-soft)}
.sent.spot.done .tk{cursor:default}
.tk.good{background:var(--ok-soft);box-shadow:inset 0 -4px 0 var(--ok)}
.tk.badspot{background:var(--bad-soft);box-shadow:inset 0 -4px 0 var(--bad)}
.tk.miss{background:var(--bad-soft);text-decoration:line-through}
.studybox{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--the-soft);border:2px solid var(--stroke)}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:99px;border:2px solid var(--stroke);background:var(--card)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.fcard{display:grid;place-items:center;align-content:center;gap:12px;min-height:280px;padding:28px 20px;text-align:center;width:100%;background:var(--card);animation:flipin .35s ease}
.fcard.flipped{background:var(--the-soft)}
.fword{font-family:var(--display);font-size:clamp(28px,7vw,44px);line-height:1.2;overflow-wrap:anywhere}
.fctx{color:var(--muted);font-weight:700;font-style:italic;font-size:16px;max-width:46ch}
.muted{color:var(--muted);font-size:.6em}
.actions.center{justify-content:center}
@keyframes flipin{from{transform:rotateY(70deg);opacity:.4}to{transform:none;opacity:1}}
.more{border:2px solid var(--stroke);border-radius:14px;background:var(--bg)}
.more summary{cursor:pointer;padding:12px 16px;font-weight:900;font-size:15px;list-style-position:inside}
.more[open] summary{border-bottom:2px dashed var(--stroke)}
.more .exlist{padding:12px}
.more .exlist li{background:var(--card)}
.exlist .slot.hl{font-size:.95em}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.xcard{text-align:left;padding:18px;display:grid;gap:8px;justify-items:start;transition:transform .12s,box-shadow .12s}
.xcard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.xcard b{font-family:var(--display);font-size:18px}
.xcard span:last-child{color:var(--muted);font-weight:700;font-size:14.5px}
.xcard .badge{font-size:15px;min-width:0;padding:4px 12px}
.spacer{flex:1}
.story{font-size:clamp(18px,4.2vw,21px);font-weight:700;line-height:2.1}
.sslot{display:inline-block;min-width:2.6em;margin:0 2px;padding:0 8px;border:2px dashed var(--stroke);border-radius:10px;background:var(--card);font-weight:900;line-height:1.5;vertical-align:baseline}
.sslot.filled{border-style:solid;background:var(--z-soft)}
.sslot.act{border-style:solid;background:var(--the);color:var(--on);box-shadow:2px 2px 0 var(--shadow)}
.sslot.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.sslot.bad{border:2px solid var(--bad);background:var(--bad-soft);text-decoration:line-through}
.sslot.z{font-family:var(--display);font-size:.8em}
.fix{display:inline-block;margin-right:4px;padding:0 6px;border-radius:8px;background:var(--ok);color:var(--on);font-weight:900;font-size:.85em}
.whys{margin:0;padding-left:18px;display:grid;gap:6px}
.picker{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  background:var(--card);border-top:2.5px solid var(--stroke);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -4px 0 var(--shadow)}
.picker .opt{min-width:64px;padding:10px 12px;font-size:18px}
.pairgrid{display:grid;gap:16px}

}

function statsPanel(){
  const rows=RULES.map(r=>({r,e:store.errs[r.id]||0,t:store.tries[r.id]||0})).filter(x=>x.e>0).sort((a,b)=>b.e-a.e||(b.e/b.t)-(a.e/a.t)).slice(0,5);
  const totT=Object.values(store.tries).reduce((a,b)=>a+b,0), totE=Object.values(store.errs).reduce((a,b)=>a+b,0);
  let h=`<section class="panel sticker"><div class="phead"><span class="label">Статистика</span><h2>Де найчастіше помилки</h2>
    <p class="meta">${totT?`Усього відповідей: ${totT} · правильних ${Math.round((totT-totE)/totT*100)}%`:'Пройди кілька вправ, і тут з\'явиться твоя статистика.'}</p></div>`;
  if(rows.length){const mx=rows[0].e; h+=`<ol class="stats">`;
    rows.forEach(x=>{h+=`<li><div class="srow"><span class="minichip g-${x.r.g}">${GROUPS[x.r.g].badge}</span><button class="link" data-act="rule" data-id="${x.r.id}">${x.r.t}</button></div>
      <div class="sline"><div class="sbar"><i class="g-${x.r.g}" style="width:${x.e/mx*100}%"></i></div><span class="meta">${x.e} з ${x.t}</span>
      <button class="btn small" data-act="play" data-pool="r:${x.r.id}">Тренувати</button></div></li>`});
    h+=`</ol>`}
  else if(totT) h+=`<p class="empty">Помилок поки немає. Так тримати!</p>`;
  return h+`</section>`;
}

  h+=`</section>`;return h;

function crowd(mode){
  // 7 little figures; a = one of many (any), the = this exact one, zero = all of them in general
  const xs=[20,52,84,116,148,180,212];
  return `<svg class="crowd" viewBox="0 0 232 92" role="img" aria-label="${mode==='a'?'один будь-який із багатьох':mode==='the'?'саме цей, відомий':'усі загалом'}">
    ${xs.map((x,i)=>{
      let c='fig'; if(mode==='a'&&i===2)c+=' pick-a'; if(mode==='the'&&i===4)c+=' pick-the'; if(mode==='zero')c+=' pick-z';
      if(mode==='the'&&i!==4)c+=' dim';
      return `<g class="${c}"><circle cx="${x}" cy="40" r="12"/><path d="M${x-9} 33 l-4 -12 l9 6 z M${x+9} 33 l4 -12 l-9 6 z"/><rect x="${x-11}" y="54" width="22" height="16" rx="7"/></g>`}).join('')}
    ${mode==='a'?`<text x="84" y="88" class="ctext">?</text>`:''}
    ${mode==='the'?`<path class="arrow" d="M148 12 L148 4 L180 4" /><text x="196" y="14" class="ctext">this</text>`:''}
  </svg>`;
}

  } else if(round.mode==='spot'){

    const words=str=>str.split(/(\s+)/).map(p=>/^\s+$/.test(p)||!p?p:tok(p,false)).join('');
    let afterHtml=af||'';
    const m=afterHtml.match(/^(\s*)(\S+)([\s\S]*)$/);

    if(m){lead=m[1];first=m[2];rest=m[3]}

    let line = words(b) + (round.wrong!=='-'? tok(wv,true,ans?state:'')+' ' : '') + (first?tok(firstWord,true,ans&&round.wrong==='-'?state:''):'') + words(rest);
    if(ans && ans.tap!=null && !ans.ok){}

    if(ans) h+=`<p class="sent" style="font-size:19px" data-ctx="${ctx}">Правильно: ${sentence(q,q.a,'ok')}</p>`;

  } else {

  } else h+=`<p class="hint">${round.mode==='choose'?'На клавіатурі можна натискати 1–4':round.mode==='spot'?'Помилка завжди пов\'язана з артиклем: зайвий, пропущений або не той':'Обери одне з правил'}</p>`;
  h+=`</section>`;

function pick(v){
  if(!round||round.answered) return;
  const q=round.qs[round.i];
  const ok = round.mode==='choose' ? v===q.a : round.mode==='spot' ? v==='hit' : v===q.r;
  round.answered={pick:v,ok};
  store.tries[q.r]=(store.tries[q.r]||0)+1; if(!ok) store.errs[q.r]=(store.errs[q.r]||0)+1;
  if(ok){round.score++;streak++; if(streak>store.best)store.best=streak; if(round.mode!=='why'){store.ok[q.id]=1; delete store.bad[q.id]}}
  else{streak=0; store.bad[q.id]=1}
  save(); render();
  const nb=document.getElementById('nextbtn'); if(nb) nb.focus({preventScroll:true});
}

function toggleWord(el){
  const k=el.dataset.w; const ctxEl=el.closest('[data-ctx]');

  else{store.words[k]={w:k,ctx:ctxEl?ctxEl.dataset.ctx:'',tr:'',t:Date.now()};toast('Додано в мої слова: '+k)}
  save();
  document.querySelectorAll('.w').forEach(s=>{if(s.dataset.w===k)s.classList.toggle('marked',!!store.words[k])});
}

  const a=b.dataset.act;
  if(a==='home'){view={name:'home'};render();scrollTo(0,0)}
  else if(a==='rule'){const from=['play','pairs','story','end','wplay','cheat'].includes(view.name)?{v:view,y:scrollY}:(view.name==='rule'&&view.from?view.from:null);view={name:'rule',id:b.dataset.id,from};render();scrollTo(0,0)}
  else if(a==='back'){const f=view.from;if(!f){view={name:'home'};render();return}view=f.v;render();scrollTo(0,f.y||0)}
  else if(a==='words'){view={name:'words'};render();scrollTo(0,0)}
  else if(a==='play'){startRound(b.dataset.pool,b.dataset.mode||store.mode);scrollTo(0,0)}
  else if(a==='stories'){view={name:'stories'};render();scrollTo(0,0)}
  else if(a==='story'){const n=parseStory(STORIES.find(x=>x.id===b.dataset.id).x).bl.length;st={id:b.dataset.id,picks:Array(n).fill(null),active:0,checked:false};view={name:'story'};render();scrollTo(0,0)}
  else if(a==='sslot'){if(st.checked)return;st.active=+b.dataset.k;render()}
  else if(a==='spick'){st.picks[st.active]=b.dataset.v;const nx=st.picks.findIndex((v,i)=>v==null&&i>st.active);const any=st.picks.indexOf(null);st.active=nx>=0?nx:(any>=0?any:null);render()}
  else if(a==='scheck'){const s0=STORIES.find(x=>x.id===st.id),bl=parseStory(s0.x).bl;st.checked=true;st.active=null;let ok=0;bl.forEach((bb,k)=>{const g=st.picks[k]===bb.a.toLowerCase();if(g)ok++;recordRule(bb.r,g)});store.storyBest=store.storyBest||{};store.storyBest[st.id]=Math.max(store.storyBest[st.id]||0,ok);save();render();if(ok===bl.length)confetti()}
  else if(a==='pairs'){startPairs();scrollTo(0,0)}
  else if(a==='cheat'){view={name:'cheat'};render();scrollTo(0,0)}
  else if(a==='ppick'){pr.picks[+b.dataset.j]=b.dataset.v;render()}
  else if(a==='pcheck'){const P=PAIRS[pr.list[pr.i]];const g1=pr.picks[0]===P[1],g2=pr.picks[1]===P[4];recordRule(P[2],g1);recordRule(P[5],g2);if(g1&&g2)pr.score++;pr.checked=true;save();render();document.getElementById('nextbtn')?.focus({preventScroll:true})}
  else if(a==='pnext'){pr.i++;pr.picks=[null,null];pr.checked=false;render();if(pr.i>=pr.list.length&&pr.score/pr.list.length>=.8)confetti()}
  else if(a==='wstudy'){startWords(b.dataset.m);scrollTo(0,0)}
  else if(a==='flip'){wr.flip=!wr.flip;render()}
  else if(a==='wans'){wGrade(b.dataset.k==='1');wr.i++;wr.flip=false;render()}
  else if(a==='wnext'){wr.i++;wr.res=null;render();const i=document.getElementById('w-in');if(i)i.focus()}
  else if(a==='mode'){store.mode=b.dataset.m;save();render()}
  else if(a==='spot'){if(!round||round.answered)return; const h=b.dataset.hit; if(h==='none'){b.classList.add('wrong')} else if(h==='0'){b.classList.add('miss')} pick(h==='1'?'hit':'miss')}
  else if(a==='pick') pick(b.dataset.v);
  else if(a==='tr'){const t=b.nextElementSibling; t.hidden=!t.hidden; b.setAttribute('aria-expanded',String(!t.hidden)); b.textContent=t.hidden?'Переклад':'Сховати переклад'}
  else if(a==='blank'){const inp=document.getElementById('m-sent');const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+'___'+inp.value.slice(en);inp.focus();const p=s+3;inp.setSelectionRange(p,p)}
  else if(a==='delmine'){const id=b.dataset.id;store.mine=store.mine.filter(m=>m.id!==id);delete store.ok[id];delete store.bad[id];save();render();toast('Приклад видалено')}
  else if(a==='delword'){delete store.words[b.dataset.w];save();render();toast('Чудово! Слово прибрано зі списку')}
  else if(a==='next'){
    round.i++; round.answered=null; round.opts=null; round.wrong=null;
    if(round.i>=round.qs.length){view={name:'end'};render(); if(round.score/round.qs.length>=.8) confetti()}
    else render();
  }
});
function article(word,base){return base==='a'&&/^[aeiou]/i.test(word)?'an':base}
function makeSpot(q){
  const after=(q.s.split('___')[1]||'').trim(); const next=(after.match(/[A-Za-z']+/)||[''])[0];
  if(q.a==='a'||q.a==='an') return Math.random()<.5?'-':(q.a==='a'?'an':'a');
  const opts = q.a==='-'?['a','the']:['a','-'];
  let w=opts[Math.floor(Math.random()*opts.length)]; if(w==='a') w=article(next,'a');
  return w;
}
app.addEventListener('submit',e=>{
  if(e.target.id==='wform'){e.preventDefault(); if(wr.res) return; const v=document.getElementById('w-in').value.trim(); if(!v) return;
    const ok=v.toLowerCase()===wr.list[wr.i]; wr.res={v,ok}; wGrade(ok); render(); const nb=document.getElementById('nextbtn'); if(nb) nb.focus(); return}
  if(e.target.id!=='addform') return; e.preventDefault();
  const f=e.target, err=document.getElementById('m-err');
  let s=document.getElementById('m-sent').value.trim().replace(/\s+/g,' ');
  const ans=(f.querySelector('input[name="m-ans"]:checked')||{}).value;
  const tr=document.getElementById('m-tr').value.trim();
  const fail=m=>{err.textContent=m;err.hidden=false};
  if(!s) return fail('Напиши речення англійською.');
  if(!s.includes('___')){
    if(ans==='-') return fail('Для Ø постав ___ перед словом, де артикля немає. Наприклад: I love ___ music.');
    const re=new RegExp('\\b'+ans+'\\b','i'); if(!re.test(s)) return fail(`У реченні немає «${ans}». Постав ___ на місце артикля.`);
    s=s.replace(re,'___');
  }
  if(s.split('___').length!==2) return fail('Має бути лише один пропуск ___.');
  s=s.replace(/^___(?=\s)/,'___').replace(/^___\s+([a-z])/,(m,c)=>ans==='-'?'___ '+c.toUpperCase():m);
  if(ans!=='-') s=s.replace(/^___\s+([A-Z])(?=[a-z])/,(m,c)=>'___ '+c.toLowerCase());
  store.mine.push({id:'m'+Date.now(),r:f.dataset.rule,s,a:ans,tr});
  save(); render(); toast('Приклад додано, він з\'явиться у вправах');
});
app.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.wtr; if(!k||!store.words[k]) return;
  store.words[k].tr=e.target.value; save();
});
document.addEventListener('keydown',e=>{
  if(view.name==='wplay'&&wr&&wr.res&&e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();document.getElementById('nextbtn')?.click();return}
  if(view.name!=='play'||!round) return;
  if(e.target.tagName==='INPUT') return;
  if(round.answered && (e.key==='Enter'||e.key===' ')){const nb=document.getElementById('nextbtn'); if(nb&&document.activeElement!==nb){e.preventDefault();nb.click()} return}
  const k=parseInt(e.key,10); if(!round.answered && k>=1 && k<=4){
    const btns=[...app.querySelectorAll('[data-act="pick"]')]; if(btns[k-1]) btns[k-1].click();
  }
});
syncWM(); render();
</script>
